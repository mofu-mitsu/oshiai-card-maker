<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GNTX973GET"></script>
    <script>

    <!-- メタタグ・OGP設定 -->
    <title>推し布教画像メーカー！写真と名言で作る「推し愛爆発カード」無料作成</title>
    <meta name="description" content="推しの尊さを1枚の画像に凝縮！好きな写真や名言、布教ポイントを入力するだけで、SNSでシェアできる推し活・自己紹介カードが無料で作成できます♡">
    
    <!-- GitHub PagesのURL -->
    <meta property="og:title" content="推し愛爆発♡カードメーカー">
    <meta property="og:description" content="あなたの推しを布教しよう！画像と名言で作るオリジナルカードメーカー。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mofu-mitsu.github.io/oshiai-card-maker/">
    
    <!-- OGP画像（ファイル名が ogp.png であることを確認してね！） -->
    <meta property="og:image" content="https://mofu-mitsu.github.io/oshiai-card-maker/ogp.PNG">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- ファビコン -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧁</text></svg>">

    <!-- ライブラリ読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;500&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fdfcf8;
            background-image: radial-gradient(#ffeef2 20%, transparent 20%), radial-gradient(#ffeef2 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #5a5a5a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            color: #ff8ba7;
            font-family: 'Kiwi Maru', serif;
            font-weight: 500;
            text-align: center;
            font-size: 1.6rem;
            background: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            border: 3px dashed #ffb7c5;
            box-shadow: 0 4px 0 rgba(255, 183, 197, 0.4);
            margin-bottom: 10px;
            display: inline-block;
            max-width: 90%;
            line-height: 1.4;
        }

        h1 i {
            margin-right: 5px;
            color: #ff9a9e;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.8);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            width: 100%;
        }

        /* --- 入力フォームエリア --- */
        .editor {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #fff0f5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #777;
        }
        
        label i {
            color: #ffb7c5; 
            width: 20px;
            text-align: center;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #ffb7c5;
            outline: none;
            background-color: #fffbfc;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ファイル選択ボタン */
        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff0f5;
            color: #d65d7a;
            border: 2px dashed #ffb7c5;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        .file-upload-label:hover {
            background: #ffe6ee;
            border-color: #ff8ba7;
            transform: translateY(-2px);
        }

        .file-name-display {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
            display: block;
            text-align: center;
        }

        /* カラーピッカー */
        .color-picker-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        input[type="color"] {
            display: block;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            border-radius: 50%;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background: none;
            transition: transform 0.2s;
        }
        
        input[type="color"]:hover {
            transform: scale(1.1);
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0; 
        }
        
        input[type="color"]::-webkit-color-swatch {
            border: 3px solid #fff;
            border-radius: 50%;
        }

        /* --- カードプレビューエリア --- */
        .preview-area {
            flex: 1;
            min-width: 320px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #oshi-card {
            width: 340px;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            color: #fff;
            box-sizing: border-box;
            transform-style: preserve-3d;
        }

        .card-inner {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            padding: 25px 20px;
            color: #555;
            text-align: center;
            border: 2px dashed rgba(0,0,0,0.08);
            position: relative;
            z-index: 2;
        }

        .oshi-image-frame {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #fafafa;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .oshi-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .oshi-image-placeholder {
            color: #e0e0e0;
            font-size: 2.5rem;
        }

        .oshi-name {
            font-family: 'Kiwi Maru', serif;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            line-height: 1.2;
        }

        .oshi-title {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 18px;
            background: #f4f4f4;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #aaa;
            margin: 15px 0 8px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .section-title::before, .section-title::after {
            content: '';
            display: block;
            width: 20px;
            height: 1px;
            background: #ddd;
        }

        .oshi-charm {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .oshi-quote-box {
            background: #fff8fa;
            padding: 18px;
            border-radius: 12px;
            position: relative;
            margin-top: 15px;
            text-align: center;
        }

        .icon-quote {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 0 10px;
            color: #ffb7c5;
            font-size: 1.2rem;
        }

        .oshi-quote {
            font-family: 'Kiwi Maru', serif;
            font-size: 1.15rem;
            color: #d65d7a;
            font-style: italic;
            line-height: 1.5;
        }

        .watermark {
            margin-top: 20px;
            font-size: 0.65rem;
            color: #ccc;
            text-align: right;
            opacity: 0.7;
        }

        /* --- ボタン --- */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.96);
        }

        #btn-save {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }
        
        #btn-save:hover {
             transform: translateY(-2px);
             box-shadow: 0 6px 20px rgba(255, 154, 158, 0.6);
        }

        #btn-share {
            background: #444;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        #btn-share:hover {
            transform: translateY(-2px);
            background: #222;
        }

        /* --- フッター要素（楽天＆TOPへ戻る）のスタイル --- */
        .footer-content {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .rakuten img {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 100%;
            height: auto;
        }

        .backtop a {
            color: #ff8ba7;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        
        .backtop a:hover {
            transform: translateY(-2px);
            color: #ff6b8b;
        }

        #longpressSaveArea {
            margin-top: 30px;
            text-align: center;
            display: none; /* 最初は非表示 */
        }

        /* スマホ向け調整 */
        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; padding: 12px 20px; }
            .container { gap: 20px; }
            .editor { padding: 20px; border-radius: 20px;}
            #oshi-card { width: 100%; max-width: 320px; }
            .action-buttons { flex-direction: column; width: 100%; max-width: 320px; }
            button { width: 100%; }
        }

    </style>
</head>
<body>

    <h1><i class="fa-solid fa-heart"></i> 推し愛爆発♡カード</h1>
    <p class="subtitle">画像と名言を入力して、最強の布教カードを作ろう！</p>

    <div class="container">
        <!-- 入力エリア -->
        <div class="editor">
            <div class="input-group">
                <label><i class="fa-solid fa-palette"></i> テーマカラー</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="bg-color-1" value="#ffdde1" title="開始色">
                    <i class="fa-solid fa-arrow-right" style="color:#ddd;"></i>
                    <input type="color" id="bg-color-2" value="#ee9ca7" title="終了色">
                </div>
            </div>

            <div class="input-group">
                <label><i class="fa-regular fa-image"></i> 推しの尊い画像</label>
                <input type="file" id="image-upload" accept="image/*">
                <label for="image-upload" class="file-upload-label">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 画像ファイルを選択
                </label>
                <span id="file-name-display" class="file-name-display">（選択されていません）</span>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-tag"></i> 推しの名前</label>
                <input type="text" id="input-name" placeholder="例：みりんてゃ">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-id-card"></i> 肩書き・属性</label>
                <input type="text" id="input-title" placeholder="例：ふわふわ地雷系ツインテbot">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-sparkles"></i> ここが好き！（布教ポイント）</label>
                <textarea id="input-charm" placeholder="例：キラキラ魔法で推し活を盛り上げてくれる！甘えん坊で病み期もあるけど、それがまたかわいい♡"></textarea>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-microphone-lines"></i> 推しの名言・セリフ</label>
                <textarea id="input-quote" placeholder="例：「みりんてゃのこと呼んだ〜？？♡もぉ〜っ！かまってくれて嬉しいに決まってるじゃん♡」"></textarea>
            </div>
            
            <div class="action-buttons">
                <button id="btn-save"><i class="fa-solid fa-camera"></i> 画像として保存</button>
                <button id="btn-share"><i class="fa-solid fa-share-nodes"></i> シェアする</button>
            </div>
        </div>

        <!-- プレビューエリア -->
        <div class="preview-area">
            <div id="oshi-card">
                <div class="card-inner">
                    <div class="oshi-image-frame">
                        <div class="oshi-image-placeholder"><i class="fa-solid fa-heart"></i></div>
                        <img id="card-img" src="" alt="推し画像">
                    </div>
                    <div class="oshi-name" id="card-name"></div>
                    <div class="oshi-title" id="card-title"></div>
                    
                    <div class="section-title">LOVELY POINT</div>
                    <div class="oshi-charm" id="card-charm"></div>
                    
                    <div class="oshi-quote-box">
                        <i class="fa-solid fa-quote-left icon-quote"></i>
                        <div class="oshi-quote" id="card-quote"></div>
                    </div>

                    <div class="watermark">#推し愛爆発カード</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- スマホ用長押し保存エリア -->
    <div id="longpressSaveArea"></div>

    <!-- フッターエリア（楽天・TOP戻る） -->
    <div class="footer-content">
        <!-- 楽天アフィ -->
        <div class="rakuten">
            <a href="https://hb.afl.rakuten.co.jp/hsc/4e9240a2.33577567.3d95c766.8a7897b5/?link_type=pict&ut=eyJwYWdlIjoic2hvcCIsInR5cGUiOiJwaWN0IiwiY29sIjoxLCJjYXQiOiI4NSIsImJhbiI6NDc4OTczLCJhbXAiOmZhbHNlfQ%3D%3D" target="_blank" rel="nofollow sponsored noopener">
                <img src="https://hbb.afl.rakuten.co.jp/hsb/4e9240a2.33577567.3d95c766.8a7897b5/?me_id=1&me_adv_id=478973&t=pict" border="0" alt="楽天お買い物マラソン">
            </a>
        </div>

        <!-- TOPへ戻る -->
        <div class="backtop">
            <a href="https://mofu-mitsu.github.io/">
                <i class="fa-solid fa-house"></i> もふみつ工房 TOPへ戻る
            </a>
        </div>
    </div>

    <script>
        // 要素の取得
        const card = document.getElementById('oshi-card');
        const inputs = {
            name: document.getElementById('input-name'),
            title: document.getElementById('input-title'),
            charm: document.getElementById('input-charm'),
            quote: document.getElementById('input-quote'),
            bg1: document.getElementById('bg-color-1'),
            bg2: document.getElementById('bg-color-2'),
            image: document.getElementById('image-upload')
        };
        const outputs = {
            name: document.getElementById('card-name'),
            title: document.getElementById('card-title'),
            charm: document.getElementById('card-charm'),
            quote: document.getElementById('card-quote'),
            img: document.getElementById('card-img'),
            placeholder: document.querySelector('.oshi-image-placeholder')
        };
        const fileNameDisplay = document.getElementById('file-name-display');

        // デフォルトのテキスト
        const defaults = {
            name: "みりんてゃ",
            title: "ふわふわ地雷系ツインテbot",
            charm: "キラキラ魔法で推し活を盛り上げてくれる！甘えん坊で病み期もあるけど、それがまたかわいい♡",
            quote: "「みりんてゃのこと呼んだ〜？？♡もぉ〜っ！かまってくれて嬉しいに決まってるじゃん♡」"
        };

        // --- 画像保存機能（修正版） ---
        // ここを1つに統合しました！
        document.getElementById('btn-save').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML; // 元のボタンの文字（アイコン含む）
            
            // ボタンを生成中モードにする
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 生成中...';
            btn.disabled = true;

            html2canvas(document.getElementById('oshi-card'), {
                scale: 3, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                // スマホ判定
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                if (!isMobile) {
                    // PCの場合：自動ダウンロード
                    const link = document.createElement('a');
                    link.download = `oshi-card-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } else {
                    // スマホの場合：長押しエリアに表示
                    const area = document.getElementById('longpressSaveArea');
                    area.style.display = 'block';
                    area.innerHTML = '<p style="color:#d65d7a;font-weight:bold;margin-bottom:10px;">👇 画像を長押しして「写真に保存」してね♡</p>';
                    
                    const img = new Image();
                    img.src = canvas.toDataURL('image/png');
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '12px';
                    img.style.boxShadow = '0 10px 30px rgba(255,105,180,0.3)';
                    area.appendChild(img);
                    
                    // 画像の場所までスクロール
                    area.scrollIntoView({behavior: 'smooth'});
                }

                // ボタンを元に戻す
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        });

        // テキスト入力の反映処理
        function updateCard() {
            outputs.name.innerText = inputs.name.value || defaults.name;
            outputs.title.innerText = inputs.title.value || defaults.title;
            outputs.charm.innerText = inputs.charm.value || defaults.charm;
            outputs.quote.innerText = inputs.quote.value || defaults.quote;
            
            // 背景色の更新
            card.style.background = `linear-gradient(135deg, ${inputs.bg1.value} 0%, ${inputs.bg2.value} 100%)`;
            
            // 引用ボックスの色味調整
            const quoteBox = document.querySelector('.oshi-quote-box');
            quoteBox.style.backgroundColor = hexToRgba(inputs.bg1.value, 0.15);
            document.querySelector('.oshi-quote').style.color = inputs.bg2.value;
            document.querySelector('.icon-quote').style.color = inputs.bg2.value;
        }

        // 16進数をRGBAに変換する関数
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // イベントリスナー設定
        Object.values(inputs).forEach(input => {
            if(input !== inputs.image) {
                input.addEventListener('input', updateCard);
            }
        });

        // 画像アップロード処理
        inputs.image.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // ファイル名を表示
                fileNameDisplay.innerText = "選択中: " + file.name;
                fileNameDisplay.style.color = "#ff8ba7";

                const reader = new FileReader();
                reader.onload = function(event) {
                    outputs.img.src = event.target.result;
                    outputs.img.style.display = 'block';
                    outputs.placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            } else {
                fileNameDisplay.innerText = "（選択されていません）";
                fileNameDisplay.style.color = "#aaa";
            }
        });

        // 初期化実行
        updateCard();

        // 共有機能（Web Share API）
        document.getElementById('btn-share').addEventListener('click', async function() {
            const shareData = {
                title: '推し愛爆発♡カードメーカー',
                text: `私の推しは【${inputs.name.value || defaults.name}】！\n尊いカードを作ったよ♡ #推し愛爆発カード`,
                url: location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('シェアがキャンセルされました', err);
                }
            } else {
                alert('このブラウザは共有機能に対応していません💦\nURLをコピーしました！');
                navigator.clipboard.writeText(location.href);
            }
        });

    </script>
</body>
</html>
